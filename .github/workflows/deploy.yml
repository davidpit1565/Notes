name: Build and deploy Daymark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run build
      - name: Verify production output
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          grep -q '/Notes/assets/' dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "Production index still points to source TSX instead of built assets."
            exit 1
          fi
          test -s dist/privacy.html
          test -s dist/support.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
