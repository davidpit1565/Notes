name: Validate native iOS app
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/native-ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/native-ios.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: xcodebuild -project ios/Daymark.xcodeproj -scheme Daymark -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
