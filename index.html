<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6fb" />
    <meta name="description" content="A calm daily planner that brings your schedule, tasks and notes together." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Dailume — make room for your day</title>
    <script>
      // Clear old app-shell caches and unregister any previous service worker.
      // A stale cached shell must never leave the planner looking like a blank page.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.filter(registration => new URL(registration.scope).pathname.includes('/Notes/'))
            .forEach(registration => registration.unregister());
        }).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys
          .filter(key => key.startsWith('dailume-shell-') || key.startsWith('daymark-shell-'))
          .map(key => caches.delete(key)))).catch(() => {});
      }
      window.setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.dataset.appReady !== 'true') {
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6fb;color:#171a2b;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><section style="max-width:360px;text-align:center;background:white;border:1px solid #e9eaf2;border-radius:24px;padding:28px;box-shadow:0 10px 35px #22264a13"><strong style="color:#6257e8;letter-spacing:1px;font-size:12px">DAILUME</strong><h1 style="font-size:24px;letter-spacing:-.7px">The planner did not load.</h1><p style="color:#777c91;line-height:1.55">Your saved items have not been intentionally deleted. Please refresh this page to try again.</p><button onclick="location.reload()" style="border:0;border-radius:999px;background:#6257e8;color:white;padding:13px 20px;font-size:15px;font-weight:600">Reload planner</button></section></main>';
        }
      }, 10000);
    </script>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6fb;color:#171a2b;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif">
        <section style="text-align:center;background:white;border:1px solid #e9eaf2;border-radius:24px;padding:28px">
          <strong style="color:#6257e8;letter-spacing:1px;font-size:12px">DAILUME</strong>
          <p style="color:#777c91">Opening your planner…</p>
          <noscript>Please enable JavaScript to use Dailume.</noscript>
        </section>
      </main>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
